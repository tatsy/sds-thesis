name: Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Japanese/English sources
        run: |
          cp main.tex main_ja.tex
          cp main.tex main_en.tex
          sed -i 's/\\usepackage{sdsthesis}/\\usepackage[english]{sdsthesis}/' main_en.tex

      - name: Set up LaTeX environment
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main_ja.tex
            main_en.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: pdf-artifact
          path: |
            main_ja.pdf
            main_en.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v5
        with:
          name: pdf-artifact

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main_ja.pdf
            main_en.pdf
