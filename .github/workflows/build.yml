name: Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        engine:
          - lualatex
          - xelatex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Make Japanese/English sources
        run: |
          python3 tests/check.py prepare

      - name: Set up LaTeX environment
        uses: xu-cheng/latex-action@v4
        with:
          latexmk_use_lualatex: ${{ matrix.engine == 'lualatex' }}
          latexmk_use_xelatex: ${{ matrix.engine == 'xelatex' }}    
          root_file: |
            main_ja.tex
            main_en.tex
            regression_ja.tex
            regression_en.tex
            regression_kuten.tex

      - name: Check regression PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 tests/check.py check

      - name: Upload PDF artifact
        if: matrix.engine == 'lualatex'
        uses: actions/upload-artifact@v5
        with:
          name: pdf-artifact
          path: |
            main_ja.pdf
            main_en.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v5
        with:
          name: pdf-artifact

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main_ja.pdf
            main_en.pdf
